[project]
name = "buildagent-node-runtime"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13",
    "httpx>=0.28",
    "psutil>=6",
    "docker>=7.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["node_runtime"]
