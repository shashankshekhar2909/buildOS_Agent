name: buildagent

# All services run on a private docker network. Host ports chosen to avoid
# collision with services already running on this machine at scaffold time.
# Internal port = service framework default. Host port = remapped to free port.

x-common-env: &common-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://buildagent:buildagent@postgres:5432/buildagent}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-please-32-chars-min}
  JWT_ALG: ${JWT_ALG:-HS256}
  JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN:-15}
  JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
  NODE_TOKEN: ${NODE_TOKEN:-change-me-node-token}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-internal-token}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-password123}
  LITELLM_URL: ${LITELLM_URL:-http://litellm:4000}
  LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-buildagent-master}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-buildagent-whatsapp}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:3300}
  FERNET_KEY: ${FERNET_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embed-small}
  BUILDAGENT_WORKSPACE_ROOT: ${BUILDAGENT_WORKSPACE_ROOT:-/workspace/buildagent-files}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buildagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildagent}
      POSTGRES_DB: ${POSTGRES_DB:-buildagent}
    ports:
      - "${HOST_POSTGRES_PORT:-5532}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buildagent}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [bnet]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${HOST_REDIS_PORT:-6479}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [bnet]

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    ports:
      - "${HOST_LITELLM_PORT:-4400}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-buildagent-master}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    networks: [bnet]

  typesense:
    image: typesense/typesense:0.25.2
    restart: unless-stopped
    ports:
      - "${HOST_TYPESENSE_PORT:-8208}:8108"
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-buildagent-typesense}
      TYPESENSE_DATA_DIR: /data
    volumes:
      - typesensedata:/data
    networks: [bnet]

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
    ports:
      - "${HOST_API_PORT:-8800}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../.buildagent-files:/workspace/buildagent-files
    networks: [bnet]

  dashboard-web:
    build:
      context: ../..
      dockerfile: apps/dashboard-web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8800}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://127.0.0.1:8800/ws}
    ports:
      - "${HOST_WEB_PORT:-3300}:3000"
    networks: [bnet]

volumes:
  pgdata:
  redisdata:
  typesensedata:

networks:
  bnet:
    driver: bridge
