[project]
name = "buildagent-agent-runtime"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "openai>=1.54",  # used as LiteLLM-compatible client
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime"]
