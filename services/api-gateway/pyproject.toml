[project]
name = "buildagent-api-gateway"
version = "0.0.1"
description = "BuildAgent API Gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "redis>=5.2",
    "httpx>=0.28",
    "websockets>=13",
    "python-multipart>=0.0.12",
    "cryptography>=44",
    "openai>=1.54",
    "google-genai>=1.0.0",
    "pgvector>=0.3",
    "paramiko>=3.5",
    "docker>=7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
